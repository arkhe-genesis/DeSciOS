[package]
name = "arkhe-desci"
version = "12.0.0"
edition = "2021"
description = "Integração ARKHE × DeSciOS — governança, segurança e rastreabilidade"
license = "MIT OR Apache-2.0"

[dependencies]
buzz-core = { path = "../buzz/crates/buzz-core" }
# We'll use mocked deps or just enough to compile if the other crates don't exist
# Since this is a standalone repo that I am supposed to submit to, let's see what the environment is.
# The user trace says "crates/arkhe-desci", but there are no other crates in this repo.
# Actually I should just put the dependencies as specified, maybe I will have to mock them or just leave it.

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
regex = "1.10"
url = "2.5"
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.12", features = ["multipart", "json"] }

[features]
default = []
ipfs = []
chainlink = []
